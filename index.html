<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>832402205陈墨瀚的计算器</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <h1 class="app-title">832402205陈墨瀚的计算器</h1>
    <div class="container">
        <div class="calculator">
            <div class="display">
                <div class="expression" id="expression">&nbsp;</div>
                <div class="result" id="result">0</div>
            </div>
            <div class="keys">
                <button class="key key-fn" data-action="clear">C</button>
                <button class="key key-fn" data-action="backspace">&#9003;</button>
                <button class="key key-op" data-value="(">(</button>
                <button class="key key-op" data-value=")">)</button>

                <button class="key" data-value="7">7</button>
                <button class="key" data-value="8">8</button>
                <button class="key" data-value="9">9</button>
                <button class="key key-op" data-value="/">&divide;</button>

                <button class="key" data-value="4">4</button>
                <button class="key" data-value="5">5</button>
                <button class="key" data-value="6">6</button>
                <button class="key key-op" data-value="*">&times;</button>

                <button class="key" data-value="1">1</button>
                <button class="key" data-value="2">2</button>
                <button class="key" data-value="3">3</button>
                <button class="key key-op" data-value="-">&minus;</button>

                <button class="key" data-value="0">0</button>
                <button class="key" data-value=".">.</button>
                <button class="key key-equals" data-action="equals">=</button>
                <button class="key key-op" data-value="+">+</button>
            </div>
        </div>

        <div class="history-panel">
            <div class="history-header">
                <h2>History</h2>
                <button class="btn-clear-all" id="clearAllBtn">Clear All</button>
            </div>
            <ul class="history-list" id="historyList">
                <li class="history-empty">No records yet</li>
            </ul>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
